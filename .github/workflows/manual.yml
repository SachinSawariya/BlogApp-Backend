name: Grant Tenant Credits

on:
  workflow_dispatch:
    inputs:
      grants:
        description: >
          JSON array of grants.
          Example:
          [{"email":"issuer@example.com","credits":100, expiryDate: 2026-12-01}]
        required: true
        type: string

      dryRun:
        description: Run without creating credits
        required: true
        default: true
        type: boolean

jobs:
  grant-tenant-credits:
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Grant Credits
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          GRANTS: ${{ inputs.grants }}
          DRY_RUN: ${{ inputs.dryRun }}
        run: npm run grant-tenant-credits

