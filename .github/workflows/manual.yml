name: Grant Tenant Credits

run-name: >
  Grant ${{ inputs.credits }} credits to ${{ inputs.email }} with Expiry Date ${{ inputs.expiryDate }}

concurrency:
  group: grant-tenant-credits
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      email:
        description: Tenant email
        required: true
        type: string

      credits:
        description: Credits to grant
        required: true
        type: number

      expiryDate:
        description: Expiry date (YYYY-MM-DD)
        required: false
        type: string

      dryRun:
        description: Run without creating credits
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  grant-tenant-credits:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Grant Credits
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          EMAIL: ${{ inputs.email }}
          CREDITS: ${{ inputs.credits }}
          EXPIRY_DATE: ${{ inputs.expiryDate }}
          DRY_RUN: ${{ inputs.dryRun }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run grant-tenant-credits
